[pycodestyle]
count = True
# E704/W503 están en la lista que pycodestyle ignora por defecto, pero fijar
# 'ignore' la reemplaza: se reponen para permitir los stubs de Protocol
# (def m(self) -> X: ...) y el corte de línea antes del operador (PEP 8 vigente).
ignore = W293,W605,E704,W503
max-line-length = 200

[pep8]
in-place = true